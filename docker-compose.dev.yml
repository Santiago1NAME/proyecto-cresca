services:
  mysql:
    image: mysql:8.0
    container_name: cresca-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.dev
    container_name: cresca-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend-api/.env
    environment:
      MYSQL_HOST: mysql
      NODE_ENV: development
    volumes:
      - ./backend-api:/app
      - /app/node_modules
    depends_on:
      - mysql

  front-apiv1:
    build:
      context: ./front-apiv1
      dockerfile: Dockerfile.dev
    container_name: cresca-frontend
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:3000
    volumes:
      - ./front-apiv1:/app
      - /app/node_modules
    depends_on:
      - backend-api

volumes:
  mysql_data: