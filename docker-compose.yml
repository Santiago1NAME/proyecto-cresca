services:
  mysql:
    image: mysql:8.0
    container_name: cresca-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build: ./backend-api
    container_name: cresca-backend
    expose:
      - "3000"
    env_file: ./backend-api/.env
    environment:
      - MYSQL_HOST=mysql
      - NODE_ENV=production
      - CORS_ORIGIN=https://localhost
    depends_on:
      mysql:
        condition: service_healthy

  front-apiv1:
    build:
      context: ./front-apiv1
      args:
        NEXT_PUBLIC_API_URL: https://localhost
    container_name: cresca-frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost
    depends_on:
      - backend-api

  nginx:
    image: nginx:alpine
    container_name: cresca-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend-api
      - front-apiv1

volumes:
  mysql_data:
